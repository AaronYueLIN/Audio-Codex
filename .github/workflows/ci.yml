name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository hygiene
        run: python scripts/repo_check.py
      - name: Compile Python source
        run: python -m compileall -q backend/src
