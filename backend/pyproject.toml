[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-codex-backend"
version = "1.1.0"
description = "Local-first backend for Audio Codex"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.1,<2",
  "pyannote.audio>=3.3,<5",
]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
