:root{
  font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
  color-scheme:light;
  color:#24241f;
  background:#f4f1e7;

  /* 1984 Toyota Truck 2P5 — 033 White + 137 Silver Metallic.
     Screen values are sRGB approximations of physical automotive paint. */
  --white-033:#e1dbc6;
  --white-033-soft:#f4f1e7;
  --white-033-high:#fbfaf5;
  --silver-137:#93948d;
  --silver-light:#c7c8c2;
  --silver-mid:#a9aaa4;
  --silver-dark:#73756f;

  --graphite:#24241f;
  --bg:var(--white-033-soft);
  --sidebar:var(--silver-137);
  --surface:var(--white-033-high);
  --surface-2:#eeeadd;
  --surface-3:#d8d5c9;
  --line:rgba(78,79,74,.20);
  --line-strong:rgba(78,79,74,.35);
  --text:var(--graphite);
  --muted:#6f706a;
  --accent:var(--silver-137);
  --accent-hover:#858780;
  --danger:#555650;
  --shadow:0 12px 30px rgba(55,55,50,.12);
}

button{cursor:pointer}

.toast{position:fixed;right:20px;bottom:20px;z-index:90;max-width:420px;padding:11px 14px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-3);color:var(--text);box-shadow:var(--shadow)}.toast.err{border-color:var(--silver-dark)}
.hidden{display:none!important}
dialog{width:min(720px,92vw);padding:0;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:rgba(56,56,51,.30);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}.ai-dialog{width:min(680px,92vw);height:min(760px,84vh);max-height:84vh;border-radius:14px}.ai-panel{display:flex;flex-direction:column;height:100%;min-height:0}.ai-head{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}.ai-title{display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:16px}.ai-title svg{width:18px;height:18px;fill:currentColor}.ai-head .search-kbd{margin-left:auto}.ai-messages{flex:1;min-height:0;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}.ai-msg{display:flex;flex-direction:column;gap:8px}.ai-msg.user{align-items:flex-end}.ai-bubble{max-width:82%;padding:12px 16px;border-radius:14px;line-height:1.6;font-size:15px;white-space:pre-wrap}.ai-msg.user .ai-bubble{background:var(--surface-3);border:1px solid var(--line)}.ai-msg.ai .ai-bubble{background:transparent;border:0;padding:0;max-width:100%}.ai-msg.ai .ai-bubble code{background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:13px}.ai-actions{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.ai-actions button{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;font:inherit;font-size:12px}.ai-actions button:hover{color:var(--text)}.ai-sources{margin-top:12px;display:flex;flex-direction:column;gap:10px}.ai-source-group{border:1px solid var(--line);border-radius:10px;overflow:hidden}.ai-source-head{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--surface-2);font-size:13px}.ai-source-head span{color:var(--muted);font-size:12px}.ai-source{padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}.ai-source:hover{background:var(--surface-2)}.ai-source-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:4px}.ai-cite{font-weight:650;color:var(--text)}.ai-ts{font-variant-numeric:tabular-nums}.ai-tag{padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.ai-source-text{line-height:1.5}.ai-composer{display:flex;align-items:flex-end;gap:10px;margin:0 22px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}.ai-input{flex:1;min-width:0;border:0;background:transparent;resize:none;font:inherit;font-size:15px;line-height:1.5;padding:6px 2px;max-height:140px;outline:none;color:var(--text)}.ai-send{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;font-size:13px;color:var(--text)}.ai-send:disabled{opacity:.45;cursor:default}.ai-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 22px 18px;color:var(--muted);font-size:12px}.ai-switch{display:inline-flex;align-items:center;gap:6px}.dlg{padding:20px}.dlg h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:block;color:var(--muted);font-size:12px}.formgrid input,.formgrid select,select.field{margin-top:5px;appearance:base-select;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--text);font:inherit;line-height:1.4;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.48);transition:border-color .15s,box-shadow .16s}select:hover{border-color:var(--line-strong)}select:focus{outline:none;border-color:var(--silver-dark);box-shadow:inset 0 1px 0 rgba(255,255,255,.48),0 0 0 3px rgba(147,148,141,.22)}select::picker-icon{margin-left:auto;color:var(--muted);transition:transform .18s}select:open::picker-icon{transform:rotate(180deg)}select::picker(select){appearance:base-select;margin-top:6px;padding:6px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}select option{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}select option:hover,select option:focus-visible{background:var(--surface-2)}select option:checked{background:var(--surface-3);font-weight:600}select option::checkmark{margin-left:auto;color:var(--silver-dark)}.wide{grid-column:1/-1}
.statusgood{color:#34352f}.statuswarn{color:#777870}
.chatlog{min-height:150px;max-height:320px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.chatmsg{margin-bottom:12px;white-space:pre-wrap;line-height:1.5}.chatmsg b{color:var(--text)}
.entityrow{display:grid;grid-template-columns:92px 1fr 80px;gap:12px}.progress{height:6px;overflow:hidden;margin-top:6px;border-radius:6px;background:var(--surface-3)}.progress>i{display:block;height:100%;background:var(--accent)}
.live-caption-panel{overflow:hidden;margin:12px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--white-033-high);contain:layout paint}.live-caption-bar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}.live-caption-bar .muted{margin-left:auto}.caption-scroller{height:230px;overflow:auto;padding:56px 12px;scroll-behavior:smooth;overscroll-behavior:contain;scroll-anchor:none;scrollbar-gutter:stable}.caption-cue{max-width:1050px;margin:0 auto 6px;padding:8px 12px;border-radius:7px;color:#777870;font-size:19px;line-height:1.52;opacity:.48;cursor:pointer;transition:.14s}.caption-cue:hover{opacity:.78}.caption-cue.active{background:var(--surface-2);color:var(--text);font-weight:600;opacity:1}.caption-time{display:inline-block;min-width:68px;margin-right:9px;color:#7f8079;font-size:11px;vertical-align:middle}

.episode-card-row{display:grid;grid-template-columns:104px minmax(0,1fr);height:104px;align-items:stretch}.episode-card-copy{display:flex;min-width:0;align-items:center;padding:14px 17px}.episode-card-copy h3{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:3;white-space:pre-wrap}

.brand-text{display:block;overflow:hidden;line-height:1.02;text-align:center;transform:translateY(0);transition:opacity .16s,width .22s,transform .24s}.mic-toggle{position:relative;display:grid;place-items:center;flex:0 0 auto;width:126px;height:158px;padding:0;border:0;border-radius:14px;background:transparent;box-shadow:none;overflow:visible;transition:background .18s,box-shadow .18s,transform .28s cubic-bezier(.2,.9,.2,1)}.mic-toggle:after{content:"";position:absolute;left:18px;right:18px;bottom:4px;height:16px;border-radius:999px;background:radial-gradient(ellipse at center,rgba(30,31,27,.20) 0%,rgba(30,31,27,0) 74%);opacity:.25;filter:blur(5px);pointer-events:none;transform:scale(.92);transition:opacity .22s,transform .28s}.mic-toggle:hover{background:transparent;box-shadow:none}.mic-toggle:hover:after{opacity:.25;transform:scale(.92)}.mic-toggle:active{transform:translateY(1px)}

      <button class="btn icon-btn" onclick="openSearch()" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></button>

</div>
<dialog id="settingsDialog" aria-label="Settings"><div class="dlg">

  <div class="formgrid">

    <label>Whisper model<input id="stModel" class="field" placeholder="base / small / medium" /></label>
    <label>Language<input id="stLanguage" class="field" placeholder="Auto / zh / en" /></label>
    <label class="wide">Windows AI Speech<div id="windowsAiSpeechStatus" class="settings-status"><i></i><span>Detecting the on-device Windows AI speech model…</span></div><span class="settings-help">Runs locally on Windows 11 24H2+. On CPU-only PCs the optional speech recognition model is downloaded through Windows Update only after you approve it.</span><div class="settings-minirow"><button type="button" class="btn" onclick="refreshSpeechStatus()">Refresh speech status</button><button type="button" class="btn" id="prepareWindowsAiSpeech" onclick="prepareWindowsAISpeechModel()">Prepare Windows AI model</button></div></label>

    <label>Deep reasoning model<input id="aiProModel" class="field" placeholder="deepseek-flash" /><span class="settings-help">Used automatically for synthesis, comparison, planning and other complex requests.</span></label>
    <label><input type="checkbox" id="aiAdaptiveRouting" /> Adaptive model routing<span class="settings-help">Routes simple actions to the fast model and complex work to the reasoning model.</span></label>
    <label><input type="checkbox" id="aiPersonalContext" /> Personal context<span class="settings-help">Lets Intelligence use bounded local recents, notes, bookmarks and explicit memories when relevant.</span></label>
    <label><input type="checkbox" id="aiConversationMemory" /> Conversation continuity<span class="settings-help">Stores conversation text in the local Audio Codex database so Intelligence can continue across the app and after restart.</span></label>

const state={view:'home',episodes:[],selected:null,selectedEntity:null,selectedCollection:null,settings:null,system:null,liveCaptionEpisode:null,currentCaptions:[],currentTranscriptSegments:[],activeCaptionId:null,librarySort:localStorage.getItem('audioCodex.librarySort')||'imported',sidebarCollapsed:localStorage.getItem('audioCodex.sidebarCollapsed')==='1',searchTimer:null,searchSeq:0,aiBusy:false,aiConversationId:localStorage.getItem('audioCodex.aiConversation')||'',aiLoadedConversationId:'',aiContext:null,aiScopeHint:'auto',aiAttachments:[],aiActions:{},aiActionSeq:0,aiClientHistory:[],aiDocked:false,contextSelection:null,pendingRewindWindow:null,listeningSessionId:null,lastListeningPosition:null,lastListeningTouch:0,playerSeeking:false,lastPlayheadSave:0,recapPauseTimer:null,watchLastEventId:0,watchPollReady:false};

let toastTimer,toastRemoveTimer;function toast(msg,err=false){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}clearTimeout(toastTimer);clearTimeout(toastRemoveTimer);t.classList.remove('toast-out');t.className='toast'+(err?' err':'');t.setAttribute('role',err?'alert':'status');t.setAttribute('aria-live',err?'assertive':'polite');t.setAttribute('aria-atomic','true');t.textContent=msg;toastTimer=setTimeout(()=>{if(!t.isConnected)return;t.classList.add('toast-out');toastRemoveTimer=setTimeout(()=>t.remove(),190)},4010);return t}

function setView(v){state.view=v;state.selectedEntity=null;state.selectedCollection=null;$$('#nav button').forEach(b=>{const active=b.dataset.view===v;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});renderView()}

async function renderView(){const c=$('#content');c.innerHTML='<div class="empty">Loading…</div>';try{if(state.view==='home')await viewHome();if(state.view==='episodes')await viewEpisodes();if(state.view==='collections')await viewCollections();if(state.view==='jobs')await viewJobs();if(state.view==='entities')await viewEntities();if(state.view==='timeline')await viewTimeline();if(state.view==='notes')await viewNotes();if(state.view==='intelligence')await viewIntelligence();if(state.view==='system')await viewSystem()}catch(e){c.innerHTML=`<div class="empty">Load failed: ${esc(e.message)}</div>`}}
async function viewHome(){const [o,eps,jobs]=await Promise.all([api('/api/overview'),refreshEpisodes(),api('/api/jobs?scope=current&limit=8')]);$('#content').innerHTML=`<div class="hero"><div><h1>Audio Codex</h1></div><div class="toolbar"><button class="btn" onclick="importAudio(false)">＋ Audio</button><button class="btn primary" onclick="importAudio(true)">＋ Folder</button></div></div><div class="cards"><div class="card"><div class="metric">${o.episodes}</div><div class="label">Episodes</div></div><div class="card"><div class="metric">${o.podcasts}</div><div class="label">Podcasts</div></div><div class="card"><div class="metric">${o.transcribed}</div><div class="label">Transcribed</div></div><div class="card"><div class="metric">${o.unfinished}</div><div class="label">Unfinished</div></div></div><div class="section"><h2>Recent</h2>${episodeGrid(eps.slice(0,8))}</div><div class="section"><h2>Jobs</h2>${jobsView(jobs)}</div>`}
function coverArt(id,title,size='cover-sm'){const initial=(String(title||'A').trim()[0]||'A').toUpperCase();return `<div class="cover-art ${size}" aria-label="Artwork"><span class="cover-fallback">${esc(initial)}</span><img loading="lazy" src="/api/artwork/episode/${id}" alt="${esc(title||'episodes')} Artwork" onerror="this.remove()"></div>`}
function episodeGrid(eps,manage=false){if(!eps.length)return '<div class="empty">No episodes yet.</div>';return `<div class="grid">${eps.map(e=>`<div class="episode click ${manage?'manage':''}" data-ai-type="episode" data-ai-id="${Number(e.id)}" onclick="openEpisode(${e.id})"><div class="episode-card-row">${coverArt(e.id,e.title)}<div class="episode-card-copy"><h3>${esc(e.title)}</h3></div>${manage?`<div class="episode-card-actions"><button class="btn danger episode-delete" onclick="event.stopPropagation();deleteEpisode(${e.id})">Delete</button></div>`:''}</div></div>`).join('')}</div>`}
function jobsView(jobs,manage=false){if(!jobs.length)return '<div class="empty">No jobs</div>';return `<div class="list">${jobs.map(j=>{const active=['queued','running','canceling'].includes(j.status);return `<div class="item"><div class="row" style="justify-content:space-between;gap:12px"><div><b>${esc(jobKindLabel(j.kind))}</b>${j.episode_title?`<div class="muted">${esc(j.episode_title)}</div>`:''}</div><div class="row"><span class="pill">${esc(jobStatusLabel(j.status))}</span><span class="muted">${Math.round((j.progress||0)*100)}%</span>${manage&&active?`<button class="btn danger" onclick="cancelJob(${j.id})">Cancel</button>`:''}${manage&&!active?`<button class="btn" onclick="deleteJob(${j.id})">Delete</button>`:''}</div></div><div style="margin-top:7px">${esc(j.message||'')}</div><div class="muted" style="margin-top:5px">Created ${date(j.created_at)} · Updated ${date(j.updated_at)}</div><div class="progress"><i style="width:${Math.round((j.progress||0)*100)}%"></i></div></div>`}).join('')}</div>`}
async function viewEpisodes(){const eps=await refreshEpisodes(state.librarySort);$('#content').innerHTML=`<div class="hero"><div><h1>Library</h1></div><div class="library-controls"><select class="field compact-field" onchange="changeLibrarySort(this.value)"><option value="imported" ${state.librarySort==='imported'?'selected':''}>Import time</option><option value="title" ${state.librarySort==='title'?'selected':''}>Alphabetical</option><option value="recent_played" ${state.librarySort==='recent_played'?'selected':''}>Recent playback</option></select></div></div>${episodeGrid(eps,true)}`}

async function deleteEpisode(id){if(!confirm('Remove this item from Library? The source audio file on disk will not be deleted.'))return;try{await api(`/api/episodes/${id}`,{method:'DELETE'});toast('Removed from Library');await viewEpisodes()}catch(e){toast('Delete failed: '+e.message,true)}}
function applySidebarState(){const app=$('#appShell');if(app)app.classList.toggle('sidebar-collapsed',state.sidebarCollapsed);const b=$('#sidebarToggle');if(b){b.setAttribute('aria-pressed',state.sidebarCollapsed?'true':'false');const label=state.sidebarCollapsed?'Expand sidebar':'Collapse sidebar';b.setAttribute('aria-label',label);b.title=label}}
function toggleSidebar(){state.sidebarCollapsed=!state.sidebarCollapsed;localStorage.setItem('audioCodex.sidebarCollapsed',state.sidebarCollapsed?'1':'0');const b=$('#sidebarToggle');if(b){b.classList.remove('is-opening','is-closing');void b.offsetWidth;b.classList.add(state.sidebarCollapsed?'is-closing':'is-opening');setTimeout(()=>b.classList.remove('is-opening','is-closing'),820)}applySidebarState()}
function openSearch(){const d=$('#searchDialog'),i=$('#searchInput');if(!d)return;if(!d.open)d.showModal();setTimeout(()=>{i?.focus();i?.select()},20)}
function closeSearch(){state.searchSeq++;const d=$('#searchDialog');if(d?.open)d.close()}
async function searchOverlay(q){const box=$('#searchResults'),seq=++state.searchSeq;q=String(q||'').trim();if(!box)return;if(!q){box.removeAttribute('aria-busy');box.innerHTML='<div class="empty">Type to search your Library.</div>';return}box.setAttribute('aria-busy','true');box.innerHTML='<div class="empty">Searching…</div>';try{const hits=await api('/api/search?q='+encodeURIComponent(q));if(seq!==state.searchSeq)return;box.innerHTML=`<div class="search-label">Search results</div>${hits.length?hits.map(h=>`<div class="search-hit" onclick="closeSearch();openEpisode(${h.episode_id},${h.start_ms})"><div class="search-hit-path">${esc(h.podcast_title)} · ${fmt(h.start_ms)}</div><div class="search-hit-title">${esc(h.episode_title)}</div><div class="search-hit-copy">${esc(h.text)}</div></div>`).join(''):'<div class="empty">No results</div>'}`}catch(e){if(seq===state.searchSeq)box.innerHTML=`<div class="empty">Search failed: ${esc(e.message)}</div>`}finally{if(seq===state.searchSeq)box.removeAttribute('aria-busy')}}
function captureAIScreenContext(){const p=$('#player'),active=$('.caption-cue.active'),title=$('.episode-detail-copy h1')||$('.hero h1');let selected='';try{selected=String(window.getSelection?.()||'').trim().slice(0,8000)}catch{}const lens=state.contextSelection;if(!selected&&lens?.text)selected=String(lens.text).slice(0,8000);const visible_items=[];for(const el of $$('[data-ai-type][data-ai-id]')){if(visible_items.length>=24)break;const r=el.getBoundingClientRect();if(r.bottom<=0||r.top>=window.innerHeight||r.right<=0||r.left>=window.innerWidth)continue;const id=Number(el.dataset.aiId),type=String(el.dataset.aiType||'');if(Number.isInteger(id)&&id>0&&['episode','entity','collection','note','bookmark','transcript_segment','watch'].includes(type))visible_items.push({type,id,index:visible_items.length+1})}const selection=lens?.segment_ids?.length?{segment_ids:lens.segment_ids,start_ms:lens.start_ms,end_ms:lens.end_ms}:null;return{view:state.view||'home',selected_episode_id:(p&&state.selected)?Number(state.selected):null,selected_entity_id:state.view==='entities'&&state.selectedEntity?Number(state.selectedEntity):null,selected_collection_id:state.view==='collections'&&state.selectedCollection?Number(state.selectedCollection):null,playhead_ms:(p&&Number.isFinite(p.currentTime))?Math.max(0,Math.round(p.currentTime*1000)):null,player_state:p?(p.ended?'ended':(p.paused?'paused':'playing')):'',visible_title:String(title?.textContent||'').trim().slice(0,300),active_caption:String(active?.textContent||'').trim().replace(/^\d\d:\d\d:\d\d\s*/, '').slice(0,2000),selected_text:selected,search_query:$('#searchDialog')?.open?String($('#searchInput')?.value||'').trim().slice(0,1000):'',visible_items,selection,rewind_window_ms:state.pendingRewindWindow||null,listening_session_id:state.listeningSessionId||''}}
function refreshAIPlaybackContext(){state.aiContext=captureAIScreenContext();renderAIContext()}
function renderAIContext(){const el=$('#aiContext'),c=state.aiContext||{};if(!el)return;const bits=[];if(state.aiScopeHint==='library')bits.push('<strong>Library context</strong>');else if(c.selected_episode_id){bits.push('<strong>Current episode</strong>');if(c.playhead_ms!=null)bits.push(`<span>${fmt(c.playhead_ms)}</span>`)}else if(c.selected_entity_id)bits.push('<strong>Current knowledge entity</strong>');else if(c.selected_collection_id)bits.push('<strong>Current collection</strong>');else bits.push(`<strong>${esc((c.view||'Library').replace(/^./,x=>x.toUpperCase()))}</strong>`);if(c.selection?.segment_ids?.length)bits.push(`<span>${c.selection.segment_ids.length} transcript segment${c.selection.segment_ids.length===1?'':'s'} selected</span>`);else if(c.selected_text)bits.push('<span>Selected text included</span>');if(c.listening_session_id)bits.push('<span>Listening context</span>');if(c.active_caption)bits.push('<span>Current transcript cue</span>');el.innerHTML=`<span class="ai-context-dot"></span><span class="ai-context-main">${bits.join(' · ')}</span><span class="ai-context-note">Entity-grounded context</span>`;el.classList.remove('hidden')}
async function loadAIConversation(){const id=String(state.aiConversationId||'').trim(),box=$('#aiMessages');if(!id||state.aiLoadedConversationId===id||!box)return;try{const c=await api(`/api/intelligence/conversations/${encodeURIComponent(id)}?limit=100`),rows=c.messages||[];state.aiClientHistory=rows.filter(m=>['user','assistant'].includes(m.role)&&String(m.content||'').trim()).slice(-20).map(m=>({role:m.role,content:String(m.content)}));if(rows.length){box.innerHTML='';for(const m of rows){if(m.role==='user')aiAppend('user',`<div class="ai-bubble">${esc(m.content||'')}</div>`);else if(m.role==='assistant')aiAppend('ai',`<div class="ai-bubble">${aiMd(m.content||'')}</div><div class="ai-actions"><span>Previous conversation</span></div>`)}}state.aiLoadedConversationId=id}catch{state.aiConversationId='';state.aiLoadedConversationId='';state.aiClientHistory=[];localStorage.removeItem('audioCodex.aiConversation')}}
function aiShouldDock(){return window.innerWidth>=1280}function applyAIPresentation(){const d=$('#aiDialog'),app=$('#appShell');if(!d)return;const dock=aiShouldDock();state.aiDocked=dock;d.classList.toggle('ai-docked',dock);app?.classList.toggle('ai-pane-open',dock&&d.open)}async function openAI(q,scopeHint='auto'){const d=$('#aiDialog');if(!d)return;state.aiContext=captureAIScreenContext();state.aiScopeHint=scopeHint||'auto';renderAIContext();closeSearch();const dock=aiShouldDock();state.aiDocked=dock;d.classList.toggle('ai-docked',dock);if(!d.open){dock?d.show():d.showModal()}$('#appShell')?.classList.toggle('ai-pane-open',dock);await loadAIConversation();const inp=$('#aiInput');if(q&&String(q).trim()){if(state.aiBusy)inp.value=String(q);else{inp.value='';await sendAIQuestion(q)}}setTimeout(()=>inp?.focus(),30)}

function newAIConversation(){if(state.aiBusy)return;state.aiConversationId='';state.aiLoadedConversationId='';state.aiClientHistory=[];localStorage.removeItem('audioCodex.aiConversation');state.aiActions={};state.aiActionSeq=0;state.aiScopeHint='auto';clearAIAttachments();state.aiContext=captureAIScreenContext();const box=$('#aiMessages');if(box)box.innerHTML='<div class="empty">Ask naturally — Intelligence can use what you\'re viewing, your local archive, visual context, and Audio Codex actions.</div>';const inp=$('#aiInput');if(inp){inp.value='';inp.style.height='auto'}renderAIContext();setTimeout(()=>inp?.focus(),20)}
function aiAppend(kind,html){const box=$('#aiMessages');const el=document.createElement('div');el.className='ai-msg '+kind;el.innerHTML=html;box.appendChild(el);box.scrollTop=box.scrollHeight;return el}
function aiMd(t){return esc(t||'').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function safeWebUrl(v){try{const u=new URL(String(v||''));return['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}
function openAISourceEpisode(id,ms){if(!state.aiDocked)closeAI();openEpisode(Number(id),Number(ms)||0)}function renderAISources(sources){if(!sources.length)return'';const transcript=sources.filter(s=>s.type!=='web'&&s.episode_id),web=sources.filter(s=>s.type==='web'&&safeWebUrl(s.url));const groups=new Map();for(const x of transcript){const k=String(x.episode_id);if(!groups.has(k))groups.set(k,{title:x.episode_title,podcast:x.podcast_title,items:[]});groups.get(k).items.push(x)}const localHtml=[...groups.values()].map(g=>`<div class="ai-source-group"><div class="ai-source-head"><b>${esc(g.title)}</b><span>${esc(g.podcast||'')} · ${g.items.length} 处</span></div>${g.items.map(x=>`<div class="ai-source" onclick="openAISourceEpisode(${x.episode_id},${x.start_ms})"><div class="ai-source-meta"><span class="ai-cite">[${esc(x.citation||x.key||'')}]</span><span class="ai-ts">${fmt(x.start_ms)}</span>${x.chapter_title?`<span class="ai-tag">${esc(x.chapter_title)}</span>`:''}${x.speaker_label?`<span class="ai-tag">${esc(x.speaker_label)}</span>`:''}</div><div class="ai-source-text">${esc(x.text)}</div></div>`).join('')}</div>`).join('');const webHtml=web.length?`<div class="ai-source-group"><div class="ai-source-head"><b>Current web</b><span>${web.length} source${web.length===1?'':'s'}</span></div>${web.map(x=>`<a class="ai-source" href="${esc(safeWebUrl(x.url))}" target="_blank" rel="noopener noreferrer" style="display:block;text-decoration:none;color:inherit"><div class="ai-source-meta"><span class="ai-cite">[${esc(x.citation||x.key||'')}]</span><span class="ai-tag">Web</span></div><div class="ai-source-text">${esc(x.title||x.url)}</div></a>`).join('')}</div>`:'';return(localHtml||webHtml)?`<div class="ai-sources">${localHtml}${webHtml}</div>`:''}
const AI_IMAGE_MAX_COUNT=4,AI_IMAGE_MAX_BYTES=10*1024*1024,AI_IMAGE_TOTAL_BYTES=24*1024*1024;

function renderAIAttachments(){const el=$('#aiAttachments'),rows=state.aiAttachments||[];if(!el)return;if(!rows.length){el.innerHTML='';el.classList.add('hidden');return}el.innerHTML=rows.map((x,i)=>`<div class="ai-attachment"><img src="${esc(x.data_url)}" alt=""><div class="ai-attachment-copy"><b>${esc(x.name||`Image ${i+1}`)}</b><span>${esc(aiImageSize(x.size))} · Vision context</span></div><button type="button" class="ai-attachment-remove" onclick="removeAIAttachment(${i})" aria-label="Remove ${esc(x.name||`image ${i+1}`)}">×</button></div>`).join('');el.classList.remove('hidden')}

/div></div><div><div class="section"><h2>Actions</h2><div class="card"><div class="toolbar"><button class="btn" onclick="addBookmark(${id})">Bookmark</button><button class="btn" onclick="addNote(${id})">Note</button></div><div style="margin-top:12px"><select id="collectionSelect" class="field"><option value="">Add to collection…</option>${cols.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="btn" style="margin-top:8px;width:100%" onclick="addToCollection(${id})">Add</button></div></div></div><div class="section"><h2>Chapters</h2>${simpleList((ep.chapters||[]).map(x=>`<span class="click" onclick="seekTo(${x.start_ms})">${fmt(x.start_ms)} ${esc(x.title)}</span>`))}</div><div class="section"><h2>Ask</h2><div id="chatlog" class="chatlog"></div><textarea id="chatInput" class="field" rows="3" placeholder="Ask about this episode" style="margin-top:8px"></textarea><button class="btn primary" style="margin-top:8px;width:100%" onclick="askChat(${id})">Send</button></div><div class="section"><h2>Entities</h2>${simpleList((ep.entities||[]).slice(0,30).map(x=>`${esc(x.type)} · ${esc(x.canonical_name)}`))}</div></div></div>`;bindPlayerCaptions();if(recaps?.recaps?.[0])renderListeningRecapCard(recaps.recaps[0]);if(seek!=null)setTimeout(()=>seekTo(seek),200);if(live)setTimeout(updateLiveCaption,120)}catch(e){toast('Open failed: '+e.message,true)}}

async function copyTranscript(){const el=$('#continuousTranscriptText');if(!el)return;try{await navigator.clipboard.writeText(el.innerText);toast('Transcript copied')}catch{toast('Copy failed',true)}}
function _captionJoin(left,right){left=String(left||'').trimEnd();right=String(right||'').trimStart();if(!left)return right;if(!right)return left;if(/^[,.;:!?，。；：！？、)\]}”’」』】》]/.test(right)||/[([{“‘「『【《]$/.test(left))return left+right;const cjk=/[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]/;return cjk.test(left.slice(-1))&&cjk.test(right.slice(0,1))?left+right:left+' '+right}
function _captionParts(text){const t=String(text||'').trim();if(!t)return[];return t.match(/.*?[.!?。！？…]+(?:["'”’）)】》]+)?|.+$/g)||[t]}
function _captionLimit(text){return /[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]/.test(text)?34:92}
function _splitLongCaption(group){const text=group.text.trim(),limit=_captionLimit(text);if(text.length<=limit)return[group];const out=[];let rest=text,baseStart=group.start_ms,fullLen=Math.max(1,text.length),used=0;while(rest.length>limit){let cut=-1;for(const mark of [',','，',';','；',':','：']){const i=rest.lastIndexOf(mark,limit);if(i>=Math.floor(limit*.55))cut=Math.max(cut,i+1)}if(cut<0){for(const mark of [',','，',';','；',':','：']){const i=rest.indexOf(mark,limit);if(i>0&&i<=Math.floor(limit*1.28)){cut=i+1;break}}}if(cut<0&&rest.length<=Math.floor(limit*1.38))break;if(cut<0){const i=rest.lastIndexOf(' ',limit);cut=i>=Math.floor(limit*.55)?i:limit}const piece=rest.slice(0,cut).trim();if(!piece)break;const pStart=baseStart+Math.round((used/fullLen)*(group.end_ms-baseStart));used+=cut;const pEnd=baseStart+Math.round((used/fullLen)*(group.end_ms-baseStart));out.push({start_ms:pStart,end_ms:Math.max(pStart+1,pEnd),text:piece});rest=rest.slice(cut).trimStart()}if(rest){const pStart=baseStart+Math.round((used/fullLen)*(group.end_ms-baseStart));out.push({start_ms:pStart,end_ms:group.end_ms,text:rest.trim()})}return out.length?out:[group]}
function semanticCaptionGroups(caps){if(!caps||!caps.length)return[];const atoms=[];for(const c of caps){const parts=_captionParts(c.text);const total=Math.max(1,parts.reduce((n,x)=>n+x.length,0));let used=0;for(const part of parts){const ratio0=used/total;used+=part.length;const ratio1=used/total;const start=Number(c.start_ms||0),end=Math.max(start+1,Number(c.end_ms||c.start_ms||0));atoms.push({start_ms:Math.round(start+(end-start)*ratio0),end_ms:Math.round(start+(end-start)*ratio1),text:part.trim()})}}const sentenceEnd=/[.!?。！？…]["'”’）)】》]*$/;const groups=[];let buf=null;const flush=()=>{if(!buf||!buf.text.trim())return;groups.push(..._splitLongCaption(buf));buf=null};for(const a of atoms){if(!a.text)continue;if(!buf)buf={start_ms:a.start_ms,end_ms:a.end_ms,text:a.text};else{buf.text=_captionJoin(buf.text,a.text);buf.end_ms=a.end_ms}if(sentenceEnd.test(a.text)){flush();continue}const limit=_captionLimit(buf.text);if(buf.text.length>Math.floor(limit*1.55)&&/[,，;；:：]/.test(buf.text))flush()}flush();return groups.map((g,i)=>({...g,id:`g${i}`}))}
function captionView(caps){if(!caps||!caps.length)return '<div class="empty" style="margin:10px">No subtitles yet.</div>';return caps.map(c=>`<div class="caption-cue" id="cap-${c.id}" data-id="${c.id}" data-start="${c.start_ms}" data-end="${c.end_ms}" onclick="seekTo(${c.start_ms})"><span class="caption-time">${fmt(c.start_ms)}</span>${esc(c.text)}</div>`).join('')}
function syncPlayerUi(){const p=$('#player'),seek=$('#playerSeek'),time=$('#playerTime'),play=$('#playerPlay');if(!p)return;const d=Number.isFinite(p.duration)&&p.duration>0?p.duration:0;if(seek)seek.value=d?String(Math.round((p.currentTime/d)*1000)):'0';if(time)time.textContent=`${fmt(p.currentTime*1000)} / ${fmt(d*1000)}`;if(play)play.textContent=p.paused?'▶':'❚❚'}
function togglePlayback(){const p=$('#player');if(!p)return;p.paused?p.play().catch(()=>{}):p.pause()}
function previewPlayerSeek(v){const p=$('#player'),time=$('#playerTime');if(!p||!time)return;const d=Number.isFinite(p.duration)?p.duration:0;time.textContent=`${fmt(d*(Number(v)/1000)*1000)} / ${fmt(d*1000)}`}
function commitPlayerSeek(v){const p=$('#player');if(!p||!Number.isFinite(p.duration))return;p.currentTime=p.duration*(Number(v)/1000);syncPlayerUi();updateLiveCaption();persistPlayhead(true)}

function persistPlayhead(force=false){const p=$('#player');if(!p||!state.selected)return;const now=Date.now();if(!force&&now-state.lastPlayheadSave<12000)return;state.lastPlayheadSave=now;api(`/api/episodes/${state.selected}/playhead`,{method:'PATCH',body:JSON.stringify({position_ms:Math.max(0,Math.round(p.currentTime*1000))})}).catch(()=>{})}
function clearAutoRecapTimer(){if(state.recapPauseTimer){clearTimeout(state.recapPauseTimer);state.recapPauseTimer=null}}
function maybeScheduleAutoRecap(reason='pause'){clearAutoRecapTimer();if(!state.settings?.ai?.auto_listening_recap||!state.selected||!state.listeningSessionId)return;const episodeId=Number(state.selected),sessionId=state.listeningSessionId;if(reason==='ended'){state.recapPauseTimer=setTimeout(()=>{if(state.selected===episodeId)generateListeningRecap(episodeId,true,sessionId)},250);return}state.recapPauseTimer=setTimeout(()=>{const p=$('#player');if(p&&p.paused&&!p.ended&&state.selected===episodeId)generateListeningRecap(episodeId,true,sessionId)},90000)}
function bindPlayerCaptions(){const p=$('#player');if(!p)return;p.addEventListener('loadedmetadata',syncPlayerUi);p.addEventListener('durationchange',syncPlayerUi);p.addEventListener('seeking',()=>{state.playerSeeking=true;clearAutoRecapTimer()});p.addEventListener('timeupdate',()=>{syncPlayerUi();updateLiveCaption();persistPlayhead(false);if(!state.playerSeeking)touchListening('progress',false)});p.addEventListener('seeked',()=>{state.playerSeeking=false;syncPlayerUi();updateLiveCaption();touchListening('seek',true)});p.addEventListener('play',()=>{clearAutoRecapTimer();syncPlayerUi();updateLiveCaption();persistPlayhead(true);if(!state.playerSeeking)touchListening('play',true)});p.addEventListener('pause',()=>{syncPlayerUi();persistPlayhead(true);if(!state.playerSeeking){touchListening('pause',true);if(!p.ended)maybeScheduleAutoRecap('pause')}});p.addEventListener('ended',()=>{state.playerSeeking=false;clearAutoRecapTimer();persistPlayhead(true);touchListening('ended',true);maybeScheduleAutoRecap('ended')});syncPlayerUi()}
function centerCaptionInPane(el){const scroller=$('#captionScroller');if(!scroller||!el)return;const sr=scroller.getBoundingClientRect(),er=el.getBoundingClientRect();const delta=(er.top+er.height/2)-(sr.top+sr.height/2);const max=Math.max(0,scroller.scrollHeight-scroller.clientHeight);const target=Math.max(0,Math.min(max,scroller.scrollTop+delta));scroller.scrollTo({top:target,behavior:'smooth'})}
function updateLiveCaption(){if(state.liveCaptionEpisode!==state.selected)return;const p=$('#player');if(!p||!state.currentCaptions.length)return;const ms=p.currentTime*1000;let lo=0,hi=state.currentCaptions.length-1,best=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(Number(state.currentCaptions[mid].start_ms)<=ms){best=mid;lo=mid+1}else hi=mid-1}if(best<0)return;let cue=state.currentCaptions[best];if(ms>Number(cue.end_ms||cue.start_ms)+3500&&best+1<state.currentCaptions.length)return;if(state.activeCaptionId===cue.id)return;const prev=state.activeCaptionId?document.getElementById(`cap-${state.activeCaptionId}`):null;if(prev)prev.classList.remove('active');const el=document.getElementById(`cap-${cue.id}`);if(el){el.classList.add('active');centerCaptionInPane(el)}state.activeCaptionId=cue.id}

async function openEntity(id){state.selectedEntity=Number(id);const e=await api(`/api/entities/${id}`);const annotation=(e.user_description||e.description||'').trim();const mentions=e.mentions||[];const relations=e.relations||[];$('#content').innerHTML=`<div class="hero"><div><button class="btn" onclick="viewEntities()">← Back</button><div class="row" style="justify-content:flex-start;gap:8px;margin-top:14px"><span class="pill">${esc(e.type)}</span><h1 style="margin:0">${esc(e.canonical_name)}</h1></div></div></div><div class="section"><h2>Annotation</h2>${annotation?`<div class="card entity-annotation">${esc(annotation)}</div>`:'<div class="empty">No annotation saved for this entity.</div>'}</div>${relations.length?`<div class="section"><h2>Connections</h2><div class="list">${relations.map(r=>`<div class="item"><span class="pill">${esc(r.relation)}</span><b>${esc(r.canonical_name)}</b><span class="muted">${esc(r.type)}</span></div>`).join('')}</div></div>`:''}<div class="section"><h2>Mentions · ${mentions.length}</h2>${mentions.length?`<div class="list">${mentions.map(m=>`<div class="item click" onclick="openEpisode(${m.episode_id})"><b>${esc(m.episode_title)}</b><div class="muted">${esc(m.podcast_title)}${m.text?` · ${esc(m.text)}`:''}</div></div>`).join('')}</div>`:'<div class="empty">No transcript mentions linked.</div>'}</div>`}
async function viewTimeline(){const rows=await api('/api/timeline');$('#content').innerHTML=`<div class="hero"><div><h1>Timeline</h1></div></div>${rows.length?`<div class="list">${rows.map(r=>`<div class="item click" onclick="openEpisode(${r.id})"><b>${esc(r.title)}</b><div class="muted">${esc(r.podcast_title)} · ${date(r.published_at||r.imported_at)}</div></div>`).join('')}</div>`:'<div class="empty">No episodes</div>'}`}
async function viewNotes(){const [notes,bm]=await Promise.all([api('/api/notes'),api('/api/bookmarks')]);$('#content').innerHTML=`<div class="hero"><div><h1>Notes & Bookmarks</h1></div></div><div class="split"><div><div class="section"><h2>Notes</h2>${notes.length?`<div class="list">${notes.map(n=>`<div class="item click" data-ai-type="note" data-ai-id="${Number(n.id)}" onclick="openEpisode(${n.episode_id||0},${n.segment_start_ms||0})"><b>${esc(n.episode_title||'Entity note')}</b><div>${esc(n.body)}</div><div class="muted">${date(n.updated_at)}</div></div>`).join('')}</div>`:'<div class="empty">No notes</div>'}</div></div><div><div class="section"><h2>Bookmarks</h2>${bm.length?`<div class="list">${bm.map(b=>`<div class="item click" data-ai-type="bookmark" data-ai-id="${Number(b.id)}" onclick="openEpisode(${b.episode_id},${b.position_ms})"><b>${esc(b.label||fmt(b.position_ms))}</b><div class="muted">${esc(b.episode_title)} · ${fmt(b.position_ms)}</div></div>`).join('')}</div>`:'<div class="empty">No bookmarks</div>'}</div></div></div>`}
function recapListItem(row){const r=row.recap||{};return`<div class="item click" onclick="openEpisode(${Number(row.episode_id)},${Number(row.sources?.[0]?.start_ms||0)})"><div class="row" style="justify-content:space-between"><b>${esc(r.title||'Listening Recap')}</b>${referenceStatusHtml([{stale:!!row.stale,sources_available:true}])}</div><div class="muted" style="margin-top:5px">${esc((r.summary||'').slice(0,240))}</div><div class="muted" style="margin-top:5px">${date(row.created_at)}</div></div>`}
async function toggleKnowledgeWatch(id,active){try{await api(`/api/intelligence/watches/${Number(id)}`,{method:'PATCH',body:JSON.stringify({active:!!active})});toast(`Knowledge Watch ${active?'resumed':'paused'}`);await viewIntelligence()}catch(e){toast('Watch update failed: '+e.message,true)}}
async function acknowledgeWatchEvent(id){try{await api(`/api/intelligence/watch-events/${Number(id)}/acknowledge`,{method:'POST'});await viewIntelligence()}catch(e){toast('Could not acknowledge: '+e.message,true)}}
async function pollKnowledgeWatches(){try{const r=await api('/api/intelligence/watch-events?unacknowledged=true&limit=8'),events=r.events||[],nav=$('#nav button[data-view=intelligence]'),maxId=events.reduce((m,e)=>Math.max(m,Number(e.id||0)),0);if(nav){nav.dataset.unread=events.length?'1':'0';nav.setAttribute('aria-label',events.length?`Intelligence · ${events.length} unread update${events.length===1?'':'s'}`:'Intelligence')}if(!state.watchPollReady){state.watchLastEventId=maxId;state.watchPollReady=true;return}const fresh=events.filter(e=>Number(e.id||0)>state.watchLastEventId).sort((a,b)=>Number(a.id)-Number(b.id));if(fresh.length){state.watchLastEventId=Math.max(state.watchLastEventId,...fresh.map(e=>Number(e.id||0)));const e=fresh[fresh.length-1];toast(`Knowledge Watch · ${e.watch_name||'New match'}${e.episode_title?` · ${e.episode_title}`:''}`);if(state.view==='home')viewHome().catch(()=>{})}}catch{}}
async function viewIntelligence(){const [w,r,schema]=await Promise.all([api('/api/intelligence/watches?include_events=true&limit=100'),api('/api/intelligence/listening/recaps?limit=50'),api('/api/intelligence/schema')]);const watches=w.watches||[],events=w.events||[],recaps=r.recaps||[],profiles=Object.keys(schema.profiles||{});$('#content').innerHTML=`<div class="hero"><div><h1>Intelligence</h1></div><div class="toolbar"><button class="btn" onclick="openAI('Create a Knowledge Watch for something I care about in future podcast transcripts. Ask only if the condition is genuinely ambiguous.','library')">＋ Knowledge Watch</button><button class="btn primary" onclick="openAI('Help me use Audio Codex Intelligence with the context on this screen.','library')">Ask Intelligence</button></div></div><div class="section"><div class="card"><div class="row" style="justify-content:space-between"><div><b>Dynamic Intelligence Profiles</b><div class="muted" style="margin-top:4px">The Agent changes model, tools and permissions per turn. Mutations remain confirmable.</div></div><div class="schema-strip">${profiles.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div></div></div><div class="intelligence-grid"><div><div class="section"><h2>Knowledge Watches</h2>${watches.length?`<div class="list">${watches.map(x=>`<div class="item watch-item" data-ai-type="watch" data-ai-id="${Number(x.id)}"><div class="watch-copy"><b>${esc(x.name)}</b><div class="muted">${esc(x.mode)} · ${esc(x.scope)}${x.query?` · ${esc(x.query)}`:''}</div><div class="muted">${Number(x.unread_count||0)} unread${x.last_event_at?` · latest ${date(x.last_event_at)}`:''}</div></div><div class="watch-actions"><button class="btn" onclick="toggleKnowledgeWatch(${x.id},${x.active?0:1})">${x.active?'Pause':'Resume'}</button></div></div>`).join('')}</div>`:'<div class="empty">No Knowledge Watches yet.</div>'}</div><div class="section"><h2>Recent matches</h2>${events.length?`<div class="list">${events.map(e=>`<div class="item watch-event ${e.acknowledged?'is-read':''}"><div class="row" style="justify-content:space-between"><b>${esc(e.watch_name||'Watch match')}</b><span class="pill">${esc(e.event_type||e.watch_mode||'match')}</span></div><div style="margin-top:5px">${esc(e.summary||'Matched local knowledge')}</div><div class="muted" style="margin-top:5px">${esc(e.episode_title||'')} · ${date(e.created_at)}</div><div class="toolbar" style="margin-top:8px">${e.episode_id?`<button class="btn" onclick="openEpisode(${e.episode_id},${Number(e.evidence?.hits?.[0]?.start_ms||0)})">Open source</button>`:''}${!e.acknowledged?`<button class="btn" onclick="acknowledgeWatchEvent(${e.id})">Mark read</button>`:''}</div></div>`).join('')}</div>`:'<div class="empty">No Watch matches yet.</div>'}</div></div><div><div class="section"><h2>Listening Recaps</h2>${recaps.length?`<div class="list">${recaps.map(recapListItem).join('')}</div>`:'<div class="empty">Recaps appear after you listen to an episode.</div>'}</div><div class="section"><h2>Reference Provenance</h2><div class="card"><b>Generated knowledge stays linked to source transcript.</b><div class="muted" style="margin-top:6px;line-height:1.5">Audio Codex hashes the exact transcript passages and fingerprints the local source audio used by Listening Recaps, episode summaries and sourced AI messages. If either reference changes, generated knowledge is marked stale instead of silently trusting old output.</div></div></div></div></div>`}
async function viewSystem(){const [s,j]=await Promise.all([api('/api/system'),api('/api/jobs?scope=current&limit=15')]);state.system=s;const rec=(s.windows_speech_recognizers||[]).map(x=>`${esc(x.language)} · ${esc(x.id||'')}<br>${esc(x.name)}`).join('<br>')||'No desktop recogniser';const aiState=s.windows_ai_ready?'Ready':(s.windows_ai_available?`Model needed · ${esc(s.windows_ai_ready_state||'NotReady')}`:'Unavailable');$('#content').innerHTML=`<div class="hero"><div><h1>System</h1></div></div><div class="cards"><div class="card"><div class="label">Windows AI Speech</div><div style="font-size:18px;font-weight:700;margin-top:8px" class="${s.windows_ai_ready?'statusgood':'statuswarn'}">${aiState}</div><div class="muted" style="margin-top:6px">${esc(s.windows_ai_engine||'No host')} · Build ${esc(s.windows_build||'Unknown')}</div></div><div class="card"><div class="label">Legacy speech packs</div><div style="font-size:18px;font-weight:700;margin-top:8px" class="${s.windows_system_speech?'statusgood':'statuswarn'}">${s.windows_system_speech?'Ready':'Not installed'}</div><div class="muted" style="margin-top:6px">${rec}</div></div><div class="card"><div class="label">faster-whisper</div><div style="font-size:18px;font-weight:700;margin-top:8px" class="${s.faster_whisper?'statusgood':'statuswarn'}">${s.faster_whisper?'Available':'Not installed'}</div></div><div class="card"><div class="label">FFmpeg</div><div style="font-size:18px;font-weight:700;margin-top:8px" class="${s.ffmpeg?'statusgood':'statuswarn'}">${s.ffmpeg?'Available':'Not required'}</div></div></div><div class="section"><h2>Jobs</h2>${jobsView(j)}</div>`}
function simpleList(arr){return arr.length?`<div class="list">${arr.map(x=>`<div class="item">${x}</div>`).join('')}</div>`:'<div class="empty">No items</div>'}
async function openSettings(){try{const [s,sys,ai]=await Promise.all([api('/api/settings'),api('/api/system'),api('/api/ai/status')]);state.settings=s;state.system=sys;$('#stProvider').value=s.transcription.provider||'windows-ai';$('#stModel').value=s.transcription.model||'base';$('#stLanguage').value=s.transcription.language||'';$('#stDiarize').checked=!!s.transcription.diarize;renderWindowsAISpeechStatus(sys);renderSpeechPackOptions(sys,s.transcription.recognizer_id||'');$('#aiProvider').value=['deepseek','openai-compatible','disabled'].includes(s.ai.provider)?s.ai.provider:'deepseek';$('#aiBaseUrl').value=s.ai.base_url||'https://api.deepseek.com';$('#aiKey').value=s.ai.api_key||'';$('#aiChatModel').value=s.ai.chat_model||'deepseek-flash';$('#aiProModel').value=s.ai.pro_model||'deepseek-flash';$('#aiAdaptiveRouting').checked=s.ai.adaptive_routing!==false;$('#aiPersonalContext').checked=s.ai.personal_context!==false;$('#aiConversationMemory').checked=s.ai.conversation_memory!==false;$('#aiAutoRecap').checked=!!s.ai.auto_listening_recap;$('#aiWebSearch').checked=false;$('#aiWebSearch').disabled=true;$('#aiVisionModel').value=s.ai.vision_model||'deepseek-flash';$('#aiVisionDetail').value=s.ai.vision_detail||'auto';$('#aiEmbedModel').value=s.ai.embedding_model||'';$('#aiContextTokens').value=s.ai.context_tokens||1000000;$('#aiThinking').checked=s.ai.thinking!==false;$('#aiShowReasoning').checked=!!s.ai.show_reasoning;$('#aiStrictTools').checked=!!s.ai.strict_tools;$('#aiReasoningEffort').value=s.ai.reasoning_effort||'high';$('#aiChatMaxTokens').value=s.ai.chat_max_tokens||4096;renderAIStatus(ai);settingsDialog.showModal()}catch(e){toast(e.message,true)}}
function renderWindowsAISpeechStatus(sys){const box=$('#windowsAiSpeechStatus'),btn=$('#prepareWindowsAiSpeech');if(!box)return;let text='',good=false;if(sys?.windows_ai_ready){good=true;text=`Ready · ${esc(sys.windows_ai_engine||'Windows AI')} · on-device`;}else if(sys?.windows_ai_available){text=`Available, model not ready · ${esc(sys.windows_ai_ready_state||'NotReady')}`;}else if(!sys?.windows_package_identity_registered){text='Package identity is not registered · run Repair/Reinstall';}else if(!sys?.windows_ai_host_built){text='Speech host is not built into this source payload';}else{text=`Unavailable${sys?.windows_ai_error?`: ${esc(sys.windows_ai_error)}`:''}`;}box.className=`settings-status ${good?'statusgood':'statuswarn'}`;box.innerHTML=`<i></i><span>${text}</span>`;if(btn)btn.disabled=!!sys?.windows_ai_ready||!sys?.windows_ai_available}
function renderSpeechPackOptions(sys,selected){const sel=$('#stRecognizer'),status=$('#speechPackStatus');if(!sel)return;const packs=sys?.windows_speech_packs||[];sel.innerHTML='<option value="">Auto-detect</option>'+packs.map(p=>`<option value="${esc(p.detected_id||p.id)}" data-language="${esc(p.language)}" ${p.installed?'':'disabled'}>${esc(p.language)} · ${esc(p.id)} · ${p.installed?'Installed':'Not installed'}</option>`).join('');if(selected&&[...sel.options].some(o=>o.value===selected&&!o.disabled))sel.value=selected;const installed=packs.filter(p=>p.installed).length;if(sys?.windows_system_speech)status.textContent=`Legacy Desktop Speech ready · ${installed} selected language pack(s) available.`;else if(sys?.faster_whisper)status.textContent='Legacy Desktop Speech is not installed; faster-whisper remains available as a fallback.';else status.textContent='No installed legacy Windows speech recogniser was detected.';sel.onchange=()=>{const o=sel.selectedOptions[0];if(o?.dataset.language)$('#stLanguage').value=o.dataset.language}}
function renderAIStatus(ai){const box=$('#aiStatus');if(!box)return;const tools=(ai?.mcp_tools||[]).length,actions=(ai?.agent_actions||[]).length,personal=ai?.personal_context?'on':'off',memory=ai?.conversation_memory?'on':'off',web=ai?.web_search_available?(ai?.web_search?'on':'off'):'unavailable',routing=ai?.adaptive_routing?'adaptive':'fixed',vision=ai?.vision_enabled?esc(ai.vision_model||'vision'):'off';box.innerHTML=`<i></i><span>${ai?.available?`Connected: ${esc(ai.provider)} · ${esc(ai.model||'model')} · ${esc(ai.base_url||'API')} · ${ai.streaming?'SSE':''}`:`Not connected: ${esc(ai?.detail||'API Key required')}`}<br>Intelligence: entity context · Dynamic Profiles · personal context ${personal} · local conversation ${memory} · vision ${vision} · web ${web} · ${routing} routing · ${tools} tools · ${actions} confirmable actions · budget ${Number(ai?.mcp_context_tokens||1000000).toLocaleString()} tokens</span>`}
async function refreshAIStatus(){try{const ai=await api('/api/ai/status?refresh=true');renderAIStatus(ai);return ai}catch(e){toast('AI API test failed: '+e.message,true)}}
async function refreshSpeechStatus(){try{const sys=await api('/api/system');state.system=sys;renderWindowsAISpeechStatus(sys);renderSpeechPackOptions(sys,$('#stRecognizer').value);toast('Speech status refreshed');return sys}catch(e){toast('Speech status failed: '+e.message,true)}}
async function prepareWindowsAISpeechModel(){if(!confirm('Prepare the optional Windows AI speech recognition model? On CPU-only PCs Windows will download several hundred MB in the background through Windows Update. The model stays on this PC and can later be removed in Settings → System → AI Components.'))return;try{const r=await api('/api/system/windows-ai-speech/ensure',{method:'POST'});toast('Windows AI speech model preparation started');watchJob(r.job_id,async()=>{await refreshSpeechStatus();toast('Windows AI speech model is ready')})}catch(e){toast('Windows AI model preparation failed: '+e.message,true)}}
async function saveSettings(){const values={transcription:{provider:$('#stProvider').value,model:$('#stModel').value.trim()||'base',language:$('#stLanguage').value.trim(),recognizer_id:$('#stRecognizer').value||'',diarize:$('#stDiarize').checked,hf_token:state.settings?.transcription?.hf_token||''},ai:{provider:$('#aiProvider').value,base_url:($('#aiBaseUrl').value.trim()||($('#aiProvider').value==='deepseek'?'https://api.deepseek.com':'')),api_key:$('#aiKey').value,chat_model:($('#aiChatModel').value.trim()||($('#aiProvider').value==='deepseek'?'deepseek-flash':'')),adaptive_routing:$('#aiAdaptiveRouting').checked,pro_model:($('#aiProModel').value.trim()||'deepseek-flash'),personal_context:$('#aiPersonalContext').checked,conversation_memory:$('#aiConversationMemory').checked,auto_listening_recap:$('#aiAutoRecap').checked,web_search:false,vision_model:($('#aiVisionModel').value.trim()||'deepseek-flash'),vision_detail:($('#aiVisionDetail').value||'auto'),embedding_model:$('#aiEmbedModel').value.trim(),context_tokens:Math.max(32000,Math.min(1000000,Number($('#aiContextTokens').value||1000000))),thinking:$('#aiThinking').checked,show_reasoning:$('#aiShowReasoning').checked,strict_tools:$('#aiStrictTools').checked,reasoning_effort:$('#aiReasoningEffort').value||'high',chat_max_tokens:Math.max(256,Math.min(393216,Number($('#aiChatMaxTokens').value||4096)))},appearance:{theme:'light'}};try{await api('/api/settings',{method:'PATCH',body:JSON.stringify({values})});state.settings={...state.settings,...values};if(!values.ai.conversation_memory){state.aiConversationId='';state.aiLoadedConversationId='';state.aiClientHistory=[];localStorage.removeItem('audioCodex.aiConversation')}settingsDialog.close();toast('Settings saved')}catch(e){toast(e.message,true)}}
applySidebarState();
$('#nav button.active')?.setAttribute('aria-current','page');
function syncTopBar(){const top=$('.top');if(top)top.classList.toggle('is-scrolled',window.scrollY>2)}
window.addEventListener('scroll',syncTopBar,{passive:true});syncTopBar();
$('#searchInput').addEventListener('input',e=>{clearTimeout(state.searchTimer);const q=e.target.value;state.searchTimer=setTimeout(()=>searchOverlay(q),180)});
$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.ctrlKey||e.metaKey){e.preventDefault();openAI(e.target.value,'library');return}const q=e.target.value.trim();if(q){closeSearch();doSearch(q)}}});
$('#searchDialog').addEventListener('click',e=>{if(e.target===$('#searchDialog'))closeSearch()});
$('#aiForm').addEventListener('submit',e=>{e.preventDefault();if(state.aiBusy)return;const inp=$('#aiInput');const q=inp.value;if(!q.trim()&&!state.aiAttachments.length)return;inp.value='';inp.style.height='auto';sendAIQuestion(q)});
$('#aiImageInput').addEventListener('change',e=>addAIImages(e.target.files));
$('#aiInput').addEventListener('paste',e=>{const files=[...(e.clipboardData?.files||[])].filter(f=>String(f.type||'').startsWith('image/'));if(files.length){e.preventDefault();addAIImages(files)}});
const aiComposer=$('#aiForm');for(const type of ['dragenter','dragover'])aiComposer.addEventListener(type,e=>{if([...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();aiComposer.classList.add('is-dragging')}});for(const type of ['dragleave','drop'])aiComposer.addEventListener(type,e=>{e.preventDefault();aiComposer.classList.remove('is-dragging');if(type==='drop')addAIImages(e.dataTransfer?.files||[])});
$('#aiInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#aiForm').requestSubmit()}});
$('#aiInput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'});
$('#aiDialog').addEventListener('click',e=>{if(e.target===$('#aiDialog')&&!state.aiDocked)closeAI()});

window.addEventListener('resize',()=>{const d=$('#aiDialog');if(!d?.open)return;const should=aiShouldDock();if(should===state.aiDocked)return;const wasOpen=d.open;if(wasOpen)d.close();state.aiDocked=should;d.classList.toggle('ai-docked',should);should?d.show():d.showModal();$('#appShell')?.classList.toggle('ai-pane-open',should)});
document.addEventListener('selectionchange',()=>{clearTimeout(window.__acLensTimer);window.__acLensTimer=setTimeout(updateContextLens,40)});
window.addEventListener('scroll',()=>{if(state.contextSelection)updateContextLens()},{passive:true});
api('/api/settings').then(s=>{state.settings=s}).catch(()=>{});
renderView();
pollKnowledgeWatches();
setInterval(pollKnowledgeWatches,60000);
</script>
